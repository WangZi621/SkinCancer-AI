  <script>
    const tl = gsap.timeline({ paused: true });
    const D = 7;

    // Camera on the real page, adapted from the registry's cursor-zoom-follow: the aim steps
    // between shots and a critically damped spring (in log zoom) turns each step into a move
    // that leads, settles and then holds still while the app works.
    function pageCamera(el, shots, duration, omega = 7) {
      const W = 1920, H = 1080, FPS = 60, SUB = 4, dt = 1 / (FPS * SUB);
      const aim = (t) => {
        let s = shots[0];
        for (const k of shots) if (t >= k.t) s = k;
        return { x: s.x, y: s.y, z: Math.log(s.z) };
      };
      const n = Math.ceil(duration * FPS) + 1;
      const out = [];
      const s = aim(0);
      const v = { x: 0, y: 0, z: 0 };
      for (let f = 0; f <= n; f++) {
        out.push({ x: s.x, y: s.y, z: s.z });
        for (let j = 0; j < SUB; j++) {
          const a = aim((f * SUB + j) * dt);
          for (const k of ["x", "y", "z"]) {
            v[k] += (omega * omega * (a[k] - s[k]) - 2 * omega * v[k]) * dt;
            s[k] += v[k] * dt;
          }
        }
      }
      const at = (t) => {
        const p = Math.max(0, Math.min(n, t * FPS));
        const i = Math.floor(p);
        const u = p - i;
        const a = out[i];
        const b = out[Math.min(n, i + 1)];
        return { x: a.x + (b.x - a.x) * u, y: a.y + (b.y - a.y) * u, z: Math.exp(a.z + (b.z - a.z) * u) };
      };
      const render = (t) => {
        const c = at(t);
        el.style.transform = `translate(${(W / 2 - c.x * c.z).toFixed(2)}px,${(H / 2 - c.y * c.z).toFixed(2)}px) scale(${c.z.toFixed(4)})`;
      };
      return { at, render };
    }
    // Labels ride the camera and are counter-scaled to the zoom they are read at.
    function pinLabels() {
      document.querySelectorAll("#root .lb").forEach((el) => {
        const [x, y] = el.dataset.at.split(",").map(Number);
        el.style.left = x + "px";
        el.style.top = y + "px";
        el.firstElementChild.style.transform = `scale(${1 / Number(el.dataset.z)})`;
      });
    }
    function showLabel(sel, tin, tout) {
      const side = document.querySelector(sel).dataset.side;
      const axis = side === "left" || side === "right" ? "scaleX" : "scaleY";
      tl.fromTo(sel + " .lb-dot", { scale: 0 }, { scale: 1, duration: 0.3, ease: "expo.out" }, tin);
      tl.fromTo(sel + " .lb-line", { [axis]: 0 }, { [axis]: 1, duration: 0.3, ease: "power2.out" }, tin + 0.06);
      tl.fromTo(sel + " .lb-card", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.28, ease: "power2.out" }, tin + 0.22);
      if (tout != null) tl.to([sel + " .lb-dot", sel + " .lb-line", sel + " .lb-card"], { opacity: 0, duration: 0.2, ease: "power2.in" }, tout);
    }

    // Shots. Recording 1 (signed in, scanned for Demo patient A) in three cuts: 1.2-3.6 s (pick
    // Sample 1), 8.87-11.33 s (Analyze, the model runs), 11.4-13.54 s (the result).
    // Scene times: click 1.37, Analyze 2.91, result 4.86. Analyze sits at the foot of the page.
    const cam = pageCamera(document.getElementById("sc-cam"), [
      { t: 0, x: 657, y: 700, z: 1.9 },
      { t: 1.45, x: 657.6, y: 330, z: 2.0 },
      { t: 2.3, x: 1110, y: 796, z: 1.9 },
      { t: 3.05, x: 657.6, y: 321.3, z: 2.1 },
      { t: 4.95, x: 1120, y: 420, z: 1.4 },
    ], D);
    pinLabels();
    const clock = { t: 0 };
    tl.to(clock, { t: D, duration: D, ease: "none", onUpdate: () => cam.render(clock.t) }, 0);
    cam.render(0);

    // match cut from 01: the lens keeps its move and lands on thumbnail 1 (screen 609.8, 609.4, d 136.8)
    tl.fromTo("#sc-lens", { x: 0, y: 0, scale: 1 }, { x: 609.8 - 960, y: 609.4 - 540, scale: 136.8 / 400, duration: 0.72, ease: "power4.out" }, 0);
    tl.to("#sc-lens", { opacity: 0, duration: 0.15, ease: "power1.in" }, 0.78);
    // colour flood: the teal ground gives way to the app around the still-moving lens
    tl.fromTo("#sc-flood", { opacity: 1 }, { opacity: 0, duration: 0.45, ease: "power2.inOut" }, 0.12);


    // the model runs: the app's ring sweeps (22 % arc, 1.1 s a turn), then the real red ring takes over
    tl.fromTo(["#sc-ring", "#sc-status"], { opacity: 0 }, { opacity: 1, duration: 0.12 }, 2.95);
    tl.fromTo("#sc-ring circle", { strokeDasharray: "22 78", strokeDashoffset: 0 }, { strokeDashoffset: -100 * (1.91 / 1.1), duration: 1.91, ease: "none" }, 2.95);
    tl.to(["#sc-ring", "#sc-status"], { opacity: 0, duration: 0.1 }, 4.86);

    showLabel("#sc-lb-result", 5.3);
    tl.fromTo("#sc-dip", { opacity: 0 }, { opacity: 0.4, duration: 0.1, ease: "none" }, 6.85);
    window.__timelines["bscan"] = tl;
  </script>
