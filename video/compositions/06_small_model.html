        const x = 167.5 + i * 50.8;
        const y = 44.6 + r * 50.8;

    const words = (sel, t, from = "#a9b6be", to = "#0f1b24") =>
      tl.fromTo(sel + " span", { opacity: 0, color: from, filter: "blur(6px)" }, { opacity: 1, color: to, filter: "blur(0px)", duration: 0.16, ease: "power2.out", stagger: 0.08 }, t);

    // 21 MB: the file lands, then its size

    tl.fromTo("#sm-size span", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.24, ease: "power2.out", stagger: 0.07 }, 0.15);
    words("#sm-l1", 0.9);

    // into a browser: the window rises behind the file, the file drops onto the app's scope,
    // and the app's own result appears

    tl.fromTo("#sm-browser", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.8, ease: "expo.out" }, 2.4);
