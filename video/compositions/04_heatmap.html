  <script>
    const tl = gsap.timeline({ paused: true });
    const D = 8.5;

    // Camera on the real page, adapted from the registry's cursor-zoom-follow: the aim steps
    // between shots and a critically damped spring (in log zoom) turns each step into a move
    // that leads, settles and then holds still while the app works.
    function pageCamera(el, shots, duration, omega = 7) {
      const W = 1920, H = 1080, FPS = 60, SUB = 4, dt = 1 / (FPS * SUB);
      const aim = (t) => {
        let s = shots[0];
        for (const k of shots) if (t >= k.t) s = k;
        return { x: s.x, y: s.y, z: Math.log(s.z) };
      };
      const n = Math.ceil(duration * FPS) + 1;
      const out = [];
      const s = aim(0);
      const v = { x: 0, y: 0, z: 0 };
      for (let f = 0; f <= n; f++) {
        out.push({ x: s.x, y: s.y, z: s.z });
        for (let j = 0; j < SUB; j++) {
          const a = aim((f * SUB + j) * dt);
          for (const k of ["x", "y", "z"]) {
            v[k] += (omega * omega * (a[k] - s[k]) - 2 * omega * v[k]) * dt;
            s[k] += v[k] * dt;
          }
        }
      }
      const at = (t) => {
        const p = Math.max(0, Math.min(n, t * FPS));
        const i = Math.floor(p);
        const u = p - i;
        const a = out[i];
        const b = out[Math.min(n, i + 1)];
        return { x: a.x + (b.x - a.x) * u, y: a.y + (b.y - a.y) * u, z: Math.exp(a.z + (b.z - a.z) * u) };
      };
      const render = (t) => {
        const c = at(t);
        el.style.transform = `translate(${(W / 2 - c.x * c.z).toFixed(2)}px,${(H / 2 - c.y * c.z).toFixed(2)}px) scale(${c.z.toFixed(4)})`;
      };
      return { at, render };
    }
    // Labels ride the camera and are counter-scaled to the zoom they are read at.
    function pinLabels() {
      document.querySelectorAll("#root .lb").forEach((el) => {
        const [x, y] = el.dataset.at.split(",").map(Number);
        el.style.left = x + "px";
        el.style.top = y + "px";
        el.firstElementChild.style.transform = `scale(${1 / Number(el.dataset.z)})`;
      });
    }
    function showLabel(sel, tin, tout) {
      const side = document.querySelector(sel).dataset.side;
      const axis = side === "left" || side === "right" ? "scaleX" : "scaleY";
      tl.fromTo(sel + " .lb-dot", { scale: 0 }, { scale: 1, duration: 0.3, ease: "expo.out" }, tin);
      tl.fromTo(sel + " .lb-line", { [axis]: 0 }, { [axis]: 1, duration: 0.3, ease: "power2.out" }, tin + 0.06);
      tl.fromTo(sel + " .lb-card", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.28, ease: "power2.out" }, tin + 0.22);
      if (tout != null) tl.to([sel + " .lb-dot", sel + " .lb-line", sel + " .lb-card"], { opacity: 0, duration: 0.2, ease: "power2.in" }, tout);
    }

    // Shots. Recording 2 starts on the last frame of recording 1, so this opens on 02's last framing.
    // Heat map click 2.14 s; the 16 passes run 2.18-4.68 s (4.2x); the map lands at 4.68 s.
    const cam = pageCamera(document.getElementById("hm-cam"), [
      { t: 0, x: 1247, y: 245, z: 2.15 }, // the verdict, as 02 left it
      { t: 0.35, x: 706, y: 414, z: 1.75 }, // the scope and "Show where it looked"
      { t: 2.05, x: 585.5, y: 291, z: 2.2 }, // the scope while it maps
    ], D);
    pinLabels();
    const clock = { t: 0 };
    tl.to(clock, { t: D, duration: D, ease: "none", onUpdate: () => cam.render(clock.t) }, 0);
    cam.render(0);

    // mapping: the red ring fills pass by pass, with the app's own status text
    const status = document.getElementById("hm-status");
    const prog = { p: 0 };
    tl.fromTo(["#hm-track", "#hm-ring", "#hm-status"], { opacity: 0 }, { opacity: 1, duration: 0.1 }, 2.18);
    tl.fromTo(
      prog,
      { p: 0 },
      {
        p: 16,
        duration: 2.5,
        ease: "none",
        onUpdate: () => {
          const n = Math.max(1, Math.min(16, Math.ceil(prog.p)));
          status.textContent = `Mapping ${n} of 16`;
        },
      },
      2.18,
    );
    tl.fromTo("#hm-ring circle", { strokeDasharray: "0 100" }, { strokeDasharray: "100 0", duration: 2.5, ease: "none" }, 2.18);
    tl.to(["#hm-track", "#hm-ring", "#hm-status"], { opacity: 0, duration: 0.08 }, 4.68);

    // the wipe across the scope: the plain photo gives way to where the model looked
    const W = 1920;
    tl.fromTo("#hm-after", { clipPath: `inset(0px ${W - 425}px 0px 0px)` }, { clipPath: `inset(0px ${W - 861}px 0px 0px)`, duration: 1.5, ease: "sine.inOut" }, 4.9);
    tl.to("#hm-after", { clipPath: "inset(0px 0px 0px 0px)", duration: 0.25, ease: "power2.in" }, 6.45);
    tl.fromTo("#hm-divider", { x: 425, opacity: 0 }, { x: 425, opacity: 1, duration: 0.15 }, 4.75);
    tl.to("#hm-divider", { x: 861, duration: 1.5, ease: "sine.inOut" }, 4.9);
    tl.to("#hm-divider", { opacity: 0, duration: 0.2 }, 6.45);

    showLabel("#hm-lb", 5.6, 8.25);

    // no exit move: 13 (track) carries on from this frame, the same take
    window.__timelines["heatmap"] = tl;
  </script>
