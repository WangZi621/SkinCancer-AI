  <script>
    const tl = gsap.timeline({ paused: true });
    const D = 11.8;

    // Camera on the real page, adapted from the registry's cursor-zoom-follow: the aim steps
    // between shots and a critically damped spring (in log zoom) turns each step into a move
    // that leads, settles and then holds still while the app works.
    function pageCamera(el, shots, duration, omega = 7) {
      const W = 1920, H = 1080, FPS = 60, SUB = 4, dt = 1 / (FPS * SUB);
      const aim = (t) => {
        let s = shots[0];
        for (const k of shots) if (t >= k.t) s = k;
        return { x: s.x, y: s.y, z: Math.log(s.z) };
      };
      const n = Math.ceil(duration * FPS) + 1;
      const out = [];
      const s = aim(0);
      const v = { x: 0, y: 0, z: 0 };
      for (let f = 0; f <= n; f++) {
        out.push({ x: s.x, y: s.y, z: s.z });
        for (let j = 0; j < SUB; j++) {
          const a = aim((f * SUB + j) * dt);
          for (const k of ["x", "y", "z"]) {
            v[k] += (omega * omega * (a[k] - s[k]) - 2 * omega * v[k]) * dt;
            s[k] += v[k] * dt;
          }
        }
      }
      const at = (t) => {
        const p = Math.max(0, Math.min(n, t * FPS));
        const i = Math.floor(p);
        const u = p - i;
        const a = out[i];
        const b = out[Math.min(n, i + 1)];
        return { x: a.x + (b.x - a.x) * u, y: a.y + (b.y - a.y) * u, z: Math.exp(a.z + (b.z - a.z) * u) };
      };
      const render = (t) => {
        const c = at(t);
        el.style.transform = `translate(${(W / 2 - c.x * c.z).toFixed(2)}px,${(H / 2 - c.y * c.z).toFixed(2)}px) scale(${c.z.toFixed(4)})`;
      };
      return { at, render };
    }
    // Labels ride the camera and are counter-scaled to the zoom they are read at.
    function pinLabels() {
      document.querySelectorAll("#root .lb").forEach((el) => {
        const [x, y] = el.dataset.at.split(",").map(Number);
        el.style.left = x + "px";
        el.style.top = y + "px";
        el.firstElementChild.style.transform = `scale(${1 / Number(el.dataset.z)})`;
      });
    }
    function showLabel(sel, tin, tout) {
      const side = document.querySelector(sel).dataset.side;
      const axis = side === "left" || side === "right" ? "scaleX" : "scaleY";
      tl.fromTo(sel + " .lb-dot", { scale: 0 }, { scale: 1, duration: 0.3, ease: "expo.out" }, tin);
      tl.fromTo(sel + " .lb-line", { [axis]: 0 }, { [axis]: 1, duration: 0.3, ease: "power2.out" }, tin + 0.06);
      tl.fromTo(sel + " .lb-card", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.28, ease: "power2.out" }, tin + 0.22);
      if (tout != null) tl.to([sel + " .lb-dot", sel + " .lb-line", sel + " .lb-card"], { opacity: 0, duration: 0.2, ease: "power2.in" }, tout);
    }

    // Shots. Recording 8 (the home screen after the scan was saved): the cursor reads the first row
    // 2.63 and the overdue recheck 4.44, Patients 6.48, Demo patient A 8.37, the body map 8.48,
    // marker 1 at 10.26.
    const cam = pageCamera(document.getElementById("clinic-cam"), [
      { t: 0, x: 732.5, y: 486.5, z: 1.7 }, // the "See first" list: Sample 1 on top
      { t: 3.35, x: 1320, y: 382, z: 1.8 }, // rechecks
      { t: 6.05, x: 960, y: 432, z: 1.25 }, // Patients
      { t: 8.57, x: 552, y: 500, z: 2 }, // Demo patient A's body map
    ], D);
    pinLabels();
    const clock = { t: 0 };
    tl.to(clock, { t: D, duration: D, ease: "none", onUpdate: () => cam.render(clock.t) }, 0);
    cam.render(0);

    // match cut from 07: the lens keeps its place, the lattice gives way, and it lands on the first
    // row's photo (page 407.5, 402.5; screen 407.5, 397.2; d 81.6 at 1.7x)
    tl.fromTo("#cl-lens", { x: 0, y: 0, scale: 1 }, { x: 407.5 - 510, y: 397.2 - 510, scale: 81.6 / 452, duration: 0.75, ease: "power4.inOut" }, 0.05);
    tl.to("#cl-lens", { opacity: 0, duration: 0.15, ease: "power1.in" }, 0.8);
    tl.fromTo("#cl-flood", { opacity: 1 }, { opacity: 0, duration: 0.45, ease: "power2.inOut" }, 0.2);

    showLabel("#cl-lb-first", 1.05, 3.25);
    showLabel("#cl-lb-recheck", 4.5, 5.95);
    showLabel("#cl-lb-map", 9.05, 11.5);
    window.__timelines["clinic"] = tl;
  </script>
