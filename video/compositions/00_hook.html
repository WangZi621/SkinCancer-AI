  <script>
    const tl = gsap.timeline({ paused: true });

    // Words appear as they are spoken (transcript times, shifted to this scene), each from a
    // short blur and grey to dress blue. A word's share of its line's time follows its length.
    function speak(sel, t0, t1) {
      const spans = [...document.querySelectorAll(sel + " span")];
      const total = spans.reduce((n, s) => n + s.textContent.trim().length + 2, 0);
      let t = t0;
      spans.forEach((s) => {
        tl.fromTo(s, { opacity: 0, color: "#a3a9b4", filter: "blur(6px)" }, { opacity: 1, color: "#14213d", filter: "blur(0px)", duration: 0.14, ease: "power2.out" }, t);
        t += ((t1 - t0) * (s.textContent.trim().length + 2)) / total;
      });
    }

    // 1. the card is already there on frame 0; it settles while the first line is spoken
    tl.fromTo("#hk-kiosk-card", { scale: 1.03 }, { scale: 1, duration: 1.4, ease: "expo.out" }, 0);
    speak("#hk-l1", 1.34, 2.55);
    speak("#hk-l2", 3.17, 3.9);

    // 2. hard cut to the couch as he sits; his name card while he says it
    tl.fromTo("#hk-name", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, 5.95);
    tl.to("#hk-name", { opacity: 0, duration: 0.2, ease: "power2.in" }, 8.2);

    // 3. the line that defuses the hook; the card lands with a small push
    tl.fromTo("#hk-mom-card", { scale: 1.04 }, { scale: 1, duration: 0.9, ease: "expo.out" }, 8.45);
    speak("#hk-l3", 8.58, 10.7);
    window.__timelines["hook"] = tl;
